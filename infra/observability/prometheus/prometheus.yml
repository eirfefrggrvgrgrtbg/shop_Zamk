global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'loki'
    static_configs:
      - targets: ['zamk_loki:3100']

  - job_name: 'tempo'
    static_configs:
      - targets: ['zamk_tempo:3200']

  - job_name: 'alloy'
    static_configs:
      - targets: ['zamk_alloy:12345']

  # Note: backend scraping will be added in subsequent milestones.
